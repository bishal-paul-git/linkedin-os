version: 1.3.0
name: linkedin-os
description: Multi-tenant, capability-aware LinkedIn relationship operating system.

entrypoints:
  system: SYSTEM.md
  master_instructions: instructions/MASTER_INSTRUCTIONS.md

product:
  multi_tenant_architecture: product/MULTI_TENANT_ARCHITECTURE.md
  onboarding: product/TENANT_ONBOARDING.md
  tenant_isolation: product/TENANT_ISOLATION.md
  capability_matrix: product/CAPABILITY_MATRIX.md
  connector_strategy: product/CONNECTOR_STRATEGY.md
  user_journey: product/USER_JOURNEY.md

runtime:
  capability_resolver: runtime/CAPABILITY_RESOLVER.md
  current_v1_memory: runtime/GOOGLE_SHEETS.md
  current_browser: runtime/CHATGPT_WORK.md

controls:
  run_control: instructions/RUN_CONTROL.md
  approvals: instructions/APPROVALS.md
  capability_gating: instructions/CAPABILITY_GATING.md
  security: SECURITY.md

schemas:
  tenant: schemas/tenant.schema.json
  integration: schemas/integration.schema.json
  capability: schemas/capability.schema.json
  contact: schemas/contact.schema.json
